name: Build and Deploy React App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Allow GitHub Actions runner dir as a safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Copy CNAME to dist
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
            echo "✅ CNAME copied to dist/"
          else
            echo "⚠️  CNAME not found"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: vltrngames.com
          keep_files: false

